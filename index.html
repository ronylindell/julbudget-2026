<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Julbudget 2026</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l10 12h-5l7 9H19v7h-6v-7H4l7-9H6z' fill='%231f4d36'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --bg: #f4f2ec;
  --surface: #fcfcfb;
  --surface-2: #f0efec;
  --line: #e2e0d9;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #76756f;
  --brand: #1f4d36;
  --brand-ink: #fbf8ef;
  --brand-soft: #e3ece5;
  --track: #cde2fb;
  --fill: #2a78d6;
  --good: #0ca30c;
  --warning: #fab219;
  --critical: #d03b3b;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
  --shadow: 0 1px 2px rgb(0 0 0 / .05), 0 2px 8px rgb(0 0 0 / .04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --line: #31312e;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9a998f;
    --brand: #173a29; --brand-ink: #f3efe2; --brand-soft: #1e2f25;
    --track: #184f95; --fill: #3987e5;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #0ca30c; --c7: #9085e9; --c8: #e66767;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --line: #31312e;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9a998f;
  --brand: #173a29; --brand-ink: #f3efe2; --brand-soft: #1e2f25;
  --track: #184f95; --fill: #3987e5;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
  --c5: #d55181; --c6: #0ca30c; --c7: #9085e9; --c8: #e66767;
  --shadow: none;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-variant-numeric: tabular-nums;
}
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
.hidden { display: none !important; }
h2 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 12px; }

/* ----- lås ----- */
#lock { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--brand); }
.lockcard { width: 100%; max-width: 360px; background: var(--surface); border-radius: 14px; padding: 28px 24px; box-shadow: 0 10px 40px rgb(0 0 0 / .25); }
.lockcard h1 { margin: 0 0 4px; font-size: 22px; }
.lockcard p { margin: 0 0 18px; color: var(--ink-2); }
.lockcard input[type=password] { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.lockcard label.rem { display: flex; gap: 8px; align-items: center; margin: 12px 0 16px; color: var(--ink-2); font-size: 14px; }
.btn { border: 0; border-radius: 8px; padding: 10px 16px; background: var(--brand); color: var(--brand-ink); font-weight: 600; cursor: pointer; }
.lockcard .btn { width: 100%; }
.err.bad { color: var(--critical); }
.err { color: var(--ink-2); font-size: 14px; min-height: 20px; margin-top: 10px; }

/* ----- topp ----- */
header.top { background: var(--brand); color: var(--brand-ink); }
header.top .wrap { display: flex; align-items: center; gap: 12px; padding-top: 14px; padding-bottom: 0; flex-wrap: wrap; }
header.top h1 { font-size: 20px; margin: 0; display: flex; align-items: center; gap: 8px; }
header.top .meta { margin-left: auto; font-size: 13px; opacity: .85; display: flex; gap: 12px; align-items: center; }
header.top .ghost { background: transparent; border: 1px solid rgb(255 255 255 / .35); color: var(--brand-ink); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
nav.tabs { display: flex; gap: 4px; width: 100%; margin-top: 10px; }
nav.tabs button { background: transparent; border: 0; color: var(--brand-ink); opacity: .75; padding: 10px 14px; border-radius: 8px 8px 0 0; cursor: pointer; font-weight: 600; }
nav.tabs button[aria-selected=true] { background: var(--bg); color: var(--ink); opacity: 1; }

main.wrap { padding-top: 20px; padding-bottom: 48px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); }
section + section { margin-top: 20px; }

/* ----- nyckeltal ----- */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.kpi .label { font-size: 13px; color: var(--ink-2); }
.kpi .value { font-size: 26px; font-weight: 650; margin-top: 2px; letter-spacing: -.01em; }
.kpi .sub { font-size: 13px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; color: var(--ink); background: var(--surface-2); }
.badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* ----- mätare ----- */
.meter { position: relative; height: 10px; border-radius: 999px; background: var(--track); overflow: hidden; }
.meter.big { height: 16px; }
.meter > span { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 999px; }
.meter > .plan { background: repeating-linear-gradient(135deg, var(--fill) 0 3px, transparent 3px 7px); opacity: .55; }
.meter > .spent { background: var(--fill); }
.meter.warn > .spent { background: var(--warning); }
.meter.over > .spent { background: var(--critical); }
.meter.warn > .plan { background: repeating-linear-gradient(135deg, var(--warning) 0 3px, transparent 3px 7px); }
.meter.over > .plan { background: repeating-linear-gradient(135deg, var(--critical) 0 3px, transparent 3px 7px); }
.totalrow { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); margin-top: 8px; gap: 8px; flex-wrap: wrap; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
.sw.plan { background: repeating-linear-gradient(135deg, var(--fill) 0 2px, transparent 2px 5px); opacity: .7; border: 1px solid var(--fill); }

.grid2 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
.catrow { display: grid; grid-template-columns: 130px 1fr auto; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.catrow:first-of-type { border-top: 0; }
.catrow .name { display: flex; align-items: center; gap: 8px; font-weight: 550; }
.catrow .nums { font-size: 13px; color: var(--ink-2); text-align: right; white-space: nowrap; }
.catrow .nums b { color: var(--ink); font-weight: 600; }

.seg { display: flex; gap: 2px; height: 12px; margin: 6px 0 4px; }
.seg span { height: 100%; border-radius: 999px; min-width: 2px; }
.seglist { list-style: none; margin: 12px 0 0; padding: 0; }
.seglist li { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 14px; border-top: 1px solid var(--line); }
.seglist li:first-child { border-top: 0; }
.seglist .amt { margin-left: auto; font-weight: 600; }
.seglist .pct { color: var(--muted); width: 44px; text-align: right; font-size: 13px; }

/* ----- personer ----- */
.groups > div + div { margin-top: 18px; }
.group-title { font-size: 14px; font-weight: 600; color: var(--ink-2); margin: 0 0 8px; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.person { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; cursor: pointer; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; }
.person:hover { border-color: var(--ink-2); }
.person .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.person .nm { font-weight: 650; font-size: 16px; }
.person .tot { font-weight: 650; }
.person .cnt { font-size: 13px; color: var(--muted); }
.person ul { list-style: none; margin: 0; padding: 0; font-size: 13px; color: var(--ink-2); }
.person li { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
.person li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person .none { font-size: 13px; color: var(--muted); font-style: italic; }
.person .bud { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }

/* ----- utgifter ----- */
.filters { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 14px; }
.chip[aria-pressed=true] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.frow { display: flex; gap: 8px; flex-wrap: wrap; }
.frow select, .frow input { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.frow input { flex: 1 1 180px; }
.summary { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; padding: 12px 0; font-size: 14px; color: var(--ink-2); }
.summary b { color: var(--ink); font-size: 18px; }

table.list { width: 100%; border-collapse: collapse; font-size: 14px; }
table.list th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.list th.sort { cursor: pointer; user-select: none; }
table.list td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.list .r { text-align: right; white-space: nowrap; }
table.list tr.planned td { color: var(--ink-2); }
.what b { font-weight: 600; display: block; }
.what small { color: var(--muted); }
.tag { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.st { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); white-space: nowrap; }
.st.planerad { border: 1px dashed var(--muted); background: transparent; }
.share { display: block; font-size: 12px; color: var(--muted); }
.kv { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; cursor: pointer; font-size: 13px; }
.empty { text-align: center; color: var(--muted); padding: 32px 8px; }

/* ----- kvittovisning ----- */
#modal { position: fixed; inset: 0; background: rgb(0 0 0 / .7); display: grid; place-items: center; padding: 16px; z-index: 10; }
#modal .box { background: var(--surface); border-radius: 12px; max-width: 900px; width: 100%; max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; }
#modal .bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); gap: 8px; }
#modal .body { overflow: auto; padding: 8px; text-align: center; }
#modal img { max-width: 100%; height: auto; }
#modal iframe { width: 100%; height: 75vh; border: 0; }

@media (max-width: 820px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .grid2 { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .kpi .value { font-size: 22px; }
  .catrow { grid-template-columns: 1fr auto; }
  .catrow .meter { grid-column: 1 / -1; order: 3; }
  table.list thead { display: none; }
  table.list, table.list tbody, table.list tr, table.list td { display: block; }
  table.list tr { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  table.list td { border: 0; padding: 0; }
  table.list td.c-what { grid-column: 1; grid-row: 1; }
  table.list td.c-amt { grid-column: 2; grid-row: 1; }
  table.list td.c-meta { grid-column: 1; grid-row: 2; font-size: 13px; color: var(--ink-2); align-self: center; }
  table.list td.c-date, table.list td.c-to, table.list td.c-cat, table.list td.c-st { display: none; }
  table.list td.c-kv { grid-column: 2; grid-row: 2; text-align: right; }
}
@media (min-width: 641px) { table.list td.c-meta { display: none; } }
</style>
</head>
<body>

<div id="lock">
  <form class="lockcard" id="lockform">
    <h1>🎄 Julbudget 2026</h1>
    <p>Skriv lösenordet för att öppna.</p>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Lösenord" required>
    <label class="rem"><input type="checkbox" id="rem" checked> Kom ihåg på den här enheten</label>
    <button class="btn" id="unlockbtn">Öppna</button>
    <div class="err" id="err"></div>
  </form>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="wrap">
      <h1>🎄 <span id="title"></span></h1>
      <div class="meta"><span id="countdown"></span><span id="viewname"></span><button class="ghost" id="logout">Lås</button></div>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="oversikt" aria-selected="true">Översikt</button>
        <button role="tab" data-tab="utgifter" aria-selected="false">Utgifter</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div id="tab-oversikt">
      <section class="kpis" id="kpis"></section>

      <section class="card">
        <h2>Hela budgeten</h2>
        <div id="totalmeter"></div>
      </section>

      <section class="grid2">
        <div class="card"><h2>Per kategori</h2><div id="cats"></div></div>
        <div class="card"><h2>Fördelning av köpt</h2><div id="split"></div></div>
      </section>

      <section>
        <h2>Vem har fått vad</h2>
        <div class="groups" id="groups"></div>
      </section>
    </div>

    <div id="tab-utgifter" class="hidden">
      <div class="filters">
        <div class="chips" id="personchips"></div>
        <div class="frow">
          <select id="fkat" aria-label="Kategori"></select>
          <select id="fstatus" aria-label="Status">
            <option value="">Köpt och planerat</option>
            <option value="köpt">Bara köpt</option>
            <option value="planerad">Bara planerat</option>
          </select>
          <input id="fsok" type="search" placeholder="Sök butik eller sak…" aria-label="Sök">
        </div>
      </div>
      <div class="card">
        <div class="summary" id="summary"></div>
        <table class="list">
          <thead><tr>
            <th class="sort" data-sort="datum">Datum</th>
            <th>Vad</th><th>Till</th><th>Kategori</th><th>Status</th>
            <th class="sort r" data-sort="belopp">Belopp</th><th></th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div id="modal" class="hidden" role="dialog" aria-modal="true">
  <div class="box">
    <div class="bar"><b id="mtitle"></b><button class="kv" id="mclose">Stäng</button></div>
    <div class="body" id="mbody"></div>
  </div>
</div>

const STORE = 'julbudget2026.pw';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = new Intl.NumberFormat('sv-FI', { style: 'currency', currency: 'EUR' });
const eur0 = new Intl.NumberFormat('sv-FI', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const money = (n) => eur.format(n);
const money0 = (n) => Math.abs(n) >= 1000 ? eur0.format(n) : eur.format(n);
const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const store = {
  get() { try { return localStorage.getItem(STORE); } catch { return null; } },
  set(v) { try { localStorage.setItem(STORE, v); } catch {} },
  clear() { try { localStorage.removeItem(STORE); } catch {} },
};

async function tryUnlock(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  for (const b of BUNDLES) {
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(b.salt), iterations: ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    try {
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(b.iv) }, key, b64(b.ct));
      return JSON.parse(new TextDecoder().decode(plain));
    } catch { /* fel lösenord för den här vyn */ }
  }
  return null;
}

$('lockform').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = $('pw').value.trim();
  $('unlockbtn').disabled = true; $('err').classList.remove('bad'); $('err').textContent = 'Öppnar…';
  const data = await tryUnlock(pw);
  $('unlockbtn').disabled = false;
  if (!data) { $('err').textContent = 'Fel lösenord.'; $('err').classList.add('bad'); return; }
  if ($('rem').checked) store.set(pw);
  start(data);
});
$('logout').addEventListener('click', () => { store.clear(); location.hash = ''; location.reload(); });

(async () => {
  const fromHash = new URLSearchParams(location.hash.slice(1)).get('l');
  const pw = fromHash || store.get();
  if (!pw) return;
  $('err').textContent = 'Öppnar…';
  const data = await tryUnlock(pw);
  if (data) {
    if (fromHash) { store.set(pw); history.replaceState(null, '', location.pathname); }
    start(data);
  } else { $('err').textContent = ''; store.clear(); }
})();

// ---------- data ----------
let D, P, K;
const state = { person: '', kat: '', status: '', sok: '', sort: 'datum', dir: -1 };

function start(data) {
  D = data;
  P = Object.fromEntries(D.personer.map(p => [p.id, p]));
  K = Object.fromEntries(D.kategorier.map((k, i) => [k.id, { ...k, color: `var(--c${(i % 8) + 1})` }]));
  $('lock').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('title').textContent = D.titel;
  document.title = D.titel;
  $('viewname').textContent = D.vy === 'delad' ? 'Delad vy' : 'Full vy';
  const days = Math.ceil((new Date('2026-12-24T00:00:00') - new Date()) / 864e5);
  $('countdown').textContent = days > 1 ? `${days} dagar till julafton` : days === 1 ? 'I morgon är det julafton!' : days === 0 ? 'God jul!' : '';
  setupFilters();
  renderOverview();
  renderList();
}

const isBought = (u) => u.status === 'köpt';
const sum = (arr, f = (u) => u.belopp) => arr.reduce((s, u) => s + f(u), 0);
const shareFor = (u, pid) => u.till.includes(pid) ? u.belopp / u.till.length : 0;

function meterHTML(spent, planned, budget, big) {
  const max = Math.max(budget, spent + planned, 0.01);
  const ratio = budget > 0 ? (spent + planned) / budget : (spent + planned > 0 ? 2 : 0);
  const cls = ratio > 1 ? 'over' : ratio >= 0.9 ? 'warn' : '';
  const sw = (spent / max) * 100, pw = ((spent + planned) / max) * 100;
  const label = budget > 0 ? `Använt ${Math.round(spent / budget * 100)} % av budgeten` : 'Ingen budget satt';
  return `<div class="meter ${big ? 'big' : ''} ${cls}" role="img" aria-label="${esc(label)}">
    ${planned > 0 ? `<span class="plan" style="width:${pw}%"></span>` : ''}
    <span class="spent" style="width:${sw}%"></span></div>`;
}

function statusBadge(left) {
  if (left < 0) return `<span class="badge"><i style="background:var(--critical)"></i>Över budget</span>`;
  return `<span class="badge"><i style="background:var(--good)"></i>Inom budget</span>`;
}

function renderOverview() {
  const U = D.utgifter;
  const spent = sum(U.filter(isBought));
  const planned = sum(U.filter(u => !isBought(u)));
  const left = D.maxbudget - spent;
  const leftAfter = left - planned;

  $('kpis').innerHTML = `
    <div class="card kpi"><div class="label">Budget</div><div class="value">${money0(D.maxbudget)}</div><div class="sub">max för hela julen</div></div>
    <div class="card kpi"><div class="label">Köpt</div><div class="value">${money0(spent)}</div><div class="sub">${U.filter(isBought).length} utgifter</div></div>
    <div class="card kpi"><div class="label">${left < 0 ? 'Över budget' : 'Kvar'}</div><div class="value">${money0(Math.abs(left))}</div><div class="sub">${statusBadge(left)}</div></div>
    <div class="card kpi"><div class="label">Kvar efter planerat</div><div class="value">${leftAfter < 0 ? '−' : ''}${money0(Math.abs(leftAfter))}</div><div class="sub">${planned > 0 ? `${money0(planned)} planerat` : 'inget planerat'}</div></div>`;

  $('totalmeter').innerHTML = meterHTML(spent, planned, D.maxbudget, true) + `
    <div class="totalrow"><span>${money(spent)} köpt${planned > 0 ? ` + ${money(planned)} planerat` : ''}</span><span>${D.maxbudget > 0 ? Math.round(spent / D.maxbudget * 100) : 0} % av ${money0(D.maxbudget)}</span></div>
    <div class="legend"><span><i class="sw" style="background:var(--fill)"></i>Köpt</span><span><i class="sw plan"></i>Planerat</span><span><i class="sw" style="background:var(--track)"></i>Kvar</span></div>`;

  const katBudgetSum = sum(D.kategorier, k => k.budget || 0);
  $('cats').innerHTML = D.kategorier.map(k => {
    const us = U.filter(u => u.kategori === k.id);
    const s = sum(us.filter(isBought)), pl = sum(us.filter(u => !isBought(u)));
    const b = k.budget || 0;
    return `<div class="catrow">
      <div class="name"><i class="sw" style="background:${K[k.id].color}"></i>${esc(k.namn)}</div>
      ${meterHTML(s, pl, b)}
      <div class="nums"><b>${money0(s)}</b> / ${money0(b)}<br>${b - s < 0 ? `<span style="color:var(--critical)">${money0(s - b)} över</span>` : `${money0(b - s)} kvar`}</div>
    </div>`;
  }).join('') + (Math.abs(katBudgetSum - D.maxbudget) > 0.5
    ? `<p style="font-size:13px;color:var(--muted);margin:10px 0 0">Kategoribudgetarna är sammanlagt ${money0(katBudgetSum)}, totalbudgeten ${money0(D.maxbudget)}.</p>` : '');

  const parts = D.kategorier.map(k => ({ k, v: sum(U.filter(u => u.kategori === k.id && isBought(u))) }));
  $('split').innerHTML = spent > 0 ? `
    <div class="seg" role="img" aria-label="Fördelning av köpt per kategori">${parts.filter(p => p.v > 0).map(p =>
      `<span title="${esc(p.k.namn)}: ${money(p.v)}" style="flex:${p.v};background:${K[p.k.id].color}"></span>`).join('')}</div>
    <ul class="seglist">${parts.map(p => `<li><i class="sw" style="background:${K[p.k.id].color}"></i>${esc(p.k.namn)}
      <span class="amt">${money(p.v)}</span><span class="pct">${Math.round(p.v / spent * 100)} %</span></li>`).join('')}</ul>`
    : `<div class="empty">Inget köpt ännu.</div>`;

  $('groups').innerHTML = D.grupper.map(g => {
    const ps = D.personer.filter(p => p.grupp === g);
    if (!ps.length) return '';
    return `<div><div class="group-title">${esc(g)}</div><div class="people">${ps.map(p => personCard(p)).join('')}</div></div>`;
  }).join('') + (() => {
    const shared = U.filter(u => !u.till.length);
    return shared.length ? `<div><div class="group-title">Utan mottagare</div><div class="people">${personCard({ id: '_ingen', namn: 'Gemensamt (mat, dekor m.m.)' }, shared)}</div></div>` : '';
  })();
  document.querySelectorAll('.person').forEach(el => el.addEventListener('click', () => {
    state.person = el.dataset.id; showTab('utgifter'); syncFilterUI(); renderList(); window.scrollTo(0, 0);
  }));
}

function personCard(p, list) {
  const items = list || D.utgifter.filter(u => u.till.includes(p.id));
  const share = (u) => list ? u.belopp : shareFor(u, p.id);
  const s = sum(items.filter(isBought), share), pl = sum(items.filter(u => !isBought(u)), share);
  const top = [...items].sort((a, b) => share(b) - share(a)).slice(0, 4);
  const more = items.length - top.length;
  return `<button class="person" data-id="${esc(p.id)}">
    <div class="row1"><span class="nm">${esc(p.namn)}</span><span class="tot">${money(s)}</span></div>
    ${p.budget ? `${meterHTML(s, pl, p.budget)}<div class="bud"><span>budget ${money0(p.budget)}</span><span>${p.budget - s - pl < 0 ? `${money0(s + pl - p.budget)} över` : `${money0(p.budget - s - pl)} kvar`}</span></div>` : ''}
    <div class="cnt">${items.length ? `${items.length} ${items.length === 1 ? 'sak' : 'saker'}${pl > 0 ? ` · ${money(pl)} planerat` : ''}` : ''}</div>
    ${items.length ? `<ul>${top.map(u => `<li><span>${u.status === 'planerad' ? '◌ ' : ''}${esc(u.beskrivning)}</span><span>${money(share(u))}</span></li>`).join('')}
      ${more > 0 ? `<li><span>+ ${more} till</span><span></span></li>` : ''}</ul>` : `<div class="none">Inget ännu</div>`}
  </button>`;
}

// ---------- lista ----------
function setupFilters() {
  $('fkat').innerHTML = `<option value="">Alla kategorier</option>` + D.kategorier.map(k => `<option value="${esc(k.id)}">${esc(k.namn)}</option>`).join('');
  $('fkat').addEventListener('change', e => { state.kat = e.target.value; renderList(); });
  $('fstatus').addEventListener('change', e => { state.status = e.target.value; renderList(); });
  $('fsok').addEventListener('input', e => { state.sok = e.target.value.toLowerCase(); renderList(); });
  document.querySelectorAll('th.sort').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.sort;
    state.dir = state.sort === k ? -state.dir : -1; state.sort = k; renderList();
  }));
  document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
  syncFilterUI();
}

function syncFilterUI() {
  const opts = [{ id: '', namn: 'Alla' }, ...D.personer, { id: '_ingen', namn: 'Utan mottagare' }];
  $('personchips').innerHTML = opts.map(o => `<button class="chip" data-id="${esc(o.id)}" aria-pressed="${state.person === o.id}">${esc(o.namn)}</button>`).join('');
  document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => { state.person = c.dataset.id; syncFilterUI(); renderList(); }));
  $('fkat').value = state.kat;
}

function showTab(t) {
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  $('tab-oversikt').classList.toggle('hidden', t !== 'oversikt');
  $('tab-utgifter').classList.toggle('hidden', t !== 'utgifter');
}

function fmtDate(d) {
  if (!d) return '–';
  const [y, m, day] = d.split('-').map(Number);
  return `${day}.${m}.`;
}

function renderList() {
  const pid = state.person;
  let rows = D.utgifter.filter(u =>
    (!pid || (pid === '_ingen' ? !u.till.length : u.till.includes(pid))) &&
    (!state.kat || u.kategori === state.kat) &&
    (!state.status || u.status === state.status) &&
    (!state.sok || `${u.beskrivning} ${u.butik} ${u.anteckning}`.toLowerCase().includes(state.sok)));
  const val = (u) => pid && pid !== '_ingen' ? shareFor(u, pid) : u.belopp;
  rows.sort((a, b) => {
    if (state.sort === 'belopp') return state.dir * (val(a) - val(b));
    if (!a.datum) return 1; if (!b.datum) return -1;
    return state.dir * a.datum.localeCompare(b.datum) || b.id - a.id;
  });
  document.querySelectorAll('th.sort').forEach(th => th.textContent = th.textContent.replace(/ [↑↓]$/, '') + (th.dataset.sort === state.sort ? (state.dir < 0 ? ' ↓' : ' ↑') : ''));

  const s = sum(rows.filter(isBought), val), pl = sum(rows.filter(u => !isBought(u)), val);
  const who = pid ? (pid === '_ingen' ? 'utan mottagare' : `till ${P[pid].namn}`) : '';
  $('summary').innerHTML = `<span>${rows.length} ${rows.length === 1 ? 'utgift' : 'utgifter'} ${esc(who)}${pl > 0 ? ` · ${money(pl)} planerat` : ''}</span><span>Köpt <b>${money(s)}</b></span>`;

  const names = (u) => u.till.length ? u.till.map(t => esc(P[t]?.namn ?? t)).join(', ') : '–';
  $('rows').innerHTML = rows.length ? rows.map(u => {
    const k = K[u.kategori];
    const shared = pid && pid !== '_ingen' && u.till.length > 1;
    const kv = u.kvitton.map((r, i) => `<button class="kv" data-u="${u.id}" data-i="${i}">🧾${u.kvitton.length > 1 ? ' ' + (i + 1) : ''}</button>`).join(' ');
    return `<tr class="${u.status === 'planerad' ? 'planned' : ''}">
      <td class="c-date">${fmtDate(u.datum)}</td>
      <td class="c-what what"><b>${u.hemlig ? '🤫 ' : ''}${esc(u.beskrivning)}</b><small>${esc(u.butik)}${u.anteckning ? ` · ${esc(u.anteckning)}` : ''}</small></td>
      <td class="c-to">${names(u)}</td>
      <td class="c-cat"><span class="tag"><i class="sw" style="background:${k.color}"></i>${esc(k.namn)}</span></td>
      <td class="c-st"><span class="st ${u.status === 'planerad' ? 'planerad' : ''}">${u.status === 'planerad' ? 'Planerad' : 'Köpt'}</span></td>
      <td class="c-amt r">${money(val(u))}${shared ? `<span class="share">andel av ${money(u.belopp)}</span>` : ''}</td>
      <td class="c-meta">${[u.datum && fmtDate(u.datum), u.till.length && names(u), esc(k.namn), u.status === 'planerad' && 'planerad'].filter(Boolean).join(' · ')}</td>
      <td class="c-kv r">${kv}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="8" class="empty">${D.utgifter.length ? 'Inga utgifter matchar filtret.' : 'Inga utgifter ännu.'}</td></tr>`;
  document.querySelectorAll('.kv[data-u]').forEach(b => b.addEventListener('click', () => openReceipt(D.utgifter.find(u => u.id == b.dataset.u), +b.dataset.i)));
}

// ---------- kvitton ----------
let blobUrl;
async function openReceipt(u, i) {
  const r = u.kvitton[i];
  $('mtitle').textContent = `${u.beskrivning} – ${r.namn}`;
  $('mbody').innerHTML = '<p>Laddar…</p>';
  $('modal').classList.remove('hidden');
  try {
    const buf = new Uint8Array(await (await fetch('k/' + r.fil)).arrayBuffer());
    const key = await crypto.subtle.importKey('raw', b64(r.nyckel), 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
    if (blobUrl) URL.revokeObjectURL(blobUrl);
    blobUrl = URL.createObjectURL(new Blob([plain], { type: r.typ }));
    $('mbody').innerHTML = r.typ === 'application/pdf'
      ? `<iframe src="${blobUrl}"></iframe><p><a href="${blobUrl}" target="_blank" rel="noopener">Öppna PDF i ny flik</a></p>`
      : `<img src="${blobUrl}" alt="Kvitto">`;
  } catch {
    $('mbody').innerHTML = '<p>Kunde inte öppna kvittot.</p>';
  }
}
const closeModal = () => $('modal').classList.add('hidden');
$('mclose').addEventListener('click', closeModal);
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
